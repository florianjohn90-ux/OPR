# Social-Media-Autopilot fuer leadgen/ — laeuft ohne menschliches Zutun.
#
# publish+engage : alle 30 Min (07–20 UTC) — postet faellige Posts (Image/Carousel/
#                  Reel auf FB + IG) und beantwortet Kommentare & Seiten-Nachrichten.
# replenish      : taeglich 03:00 UTC — generiert Content nach (Reels/Carousels/Images,
#                  Conversion/Trust/Engagement-Mix), plant ein, rendert Bilder & Videos.
# research       : montags 04:00 UTC — Wettbewerber-Analyse via Meta Ad Library,
#                  speist die Content-Generierung mit funktionierenden Mustern.
#
# Benoetigte Repo-Secrets: META_PAGE_ID, META_PAGE_TOKEN, META_IG_USER_ID, ANTHROPIC_API_KEY
# Optionale Repo-Variable: PUBLIC_ASSET_BASE (oeffentliche Basis-URL der Assets, fuer IG)
name: Social Autopilot

on:
  schedule:
    - cron: '*/30 7-20 * * *'
    - cron: '0 3 * * *'
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: social-autopilot
  cancel-in-progress: false

jobs:
  publish-and-engage:
    if: github.event.schedule == '*/30 7-20 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Publish due posts (alle Marken)
        working-directory: leadgen/engine
        env:
          BRANDS_META_JSON: ${{ secrets.BRANDS_META_JSON }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
        run: node publish-meta.mjs
      - name: Engage (Kommentare & Nachrichten, alle Marken)
        working-directory: leadgen/engine
        env:
          BRANDS_META_JSON: ${{ secrets.BRANDS_META_JSON }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node engage.mjs
      - name: Commit status
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@github.com"
          git add leadgen/content/
          git diff --cached --quiet || git commit -m "autopilot: publish + engage status"
          git push

  replenish:
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install deps (node, ffmpeg, edge-tts)
        working-directory: leadgen/engine
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip3 install --quiet edge-tts
      - name: Replenish content bank
        working-directory: leadgen/engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node replenish.mjs
      - name: Brandify (Bank -> 10 Marken-Kalender, je Marke neu getextet)
        working-directory: leadgen/engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node brandify.mjs
      - name: Render images & videos (alle Marken, 7-Tage-Fenster)
        working-directory: leadgen/engine
        run: |
          node render-image.mjs
          node render-video.mjs
      - name: Commit new content
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@github.com"
          git add leadgen/content/
          git diff --cached --quiet || git commit -m "autopilot: replenish content + assets"
          git push

  research:
    if: github.event.schedule == '0 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Competitor research (Meta Ad Library)
        working-directory: leadgen/engine
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node competitor-research.mjs
      - name: Commit insights
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@github.com"
          git add leadgen/content/competitor-insights.json
          git diff --cached --quiet || git commit -m "autopilot: weekly competitor insights"
          git push
